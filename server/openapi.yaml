            schema: {type: object, required: [image], properties: {image: {type: string, format: binary}, is_primary: {type: boolean}}}
      responses: {'201': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}
  /api/host/room-types:
    get:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: List private room types for the current host
      parameters: [{in: query, name: studio_id, schema: {type: integer, minimum: 1}}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
    post:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Create a room type owned by a studio
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'201': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /api/host/room-types/{id}:
    patch:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Update a private room type
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}}
  /api/equipments/{id}:
    delete:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Permanently delete an equipment item only when no booking references it
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/rooms/{id}/rates/{rate_id}:
    delete:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Permanently delete an inactive, unreferenced room rate
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {in: path, name: rate_id, required: true, schema: {type: integer, minimum: 1}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/host/legal-profile:
    get:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Get the current host legal profile
      responses: {'200': {$ref: '#/components/responses/Success'}}
    patch:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Create or update individual/company legal profile
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}}
  /api/admin/legal-profiles:
    get:
      tags: [Administration]
      security: [{bearerAuth: []}]
      summary: List host legal profiles for admin review
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [submitted, verified, rejected]}}
        - {in: query, name: page, schema: {type: integer, minimum: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}}
  /api/admin/legal-profiles/{id}/decision:
    patch:
      tags: [Administration]
      security: [{bearerAuth: []}]
      summary: Verify or reject a submitted host legal profile
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verified]
              properties:
                verified: {type: boolean}
                reason: {type: string}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/host/contracts:
    get:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: List contracts for the current host
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/host/contracts/{id}:
    get:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: View contract status and term dates
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}}
  /api/host/contracts/{id}/document-access:
    post:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Issue a single-use five-minute link for an active contract PDF
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'201': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/host/contracts/{id}/documents/{token}:
    get:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Download a contract PDF using its single-use access token
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {in: path, name: token, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200': {description: Private PDF stream}
        '404': {$ref: '#/components/responses/Error'}
  /api/admin/studios/{studio_id}/contracts:
    post:
      tags: [Administration]
      security: [{bearerAuth: []}]
      summary: Register a contract PDF up to 2 MiB and its status/term for a studio
      parameters: [{in: path, name: studio_id, required: true, schema: {type: integer, minimum: 1}}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [contract_code, title, document]
              properties:
                contract_code: {type: string, maxLength: 80}
                title: {type: string, maxLength: 180}
                status: {type: string, enum: [draft, pending, active]}
                effective_from: {type: string, format: date}
                effective_to: {type: string, format: date}
                document: {type: string, format: binary}
      responses: {'201': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /api/admin/refund-exceptions/{id}/actions:
    post:
      tags: [Administration]
      security: [{bearerAuth: []}]
      summary: Record an admin-attested external refund result; this endpoint does not move money
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [confirm_succeeded, mark_failed]}
                evidence_reference: {type: string, maxLength: 255, description: Required for confirm_succeeded}
                reason: {type: string, description: Required for mark_failed}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    BookingRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [room_id, rate_id, start_time, end_time]
            properties:
              room_id: {type: integer}
              rate_id: {type: integer}
              start_time: {type: string, example: '2026-11-20 09:00:00'}
              end_time: {type: string, example: '2026-11-20 12:00:00'}
              party_size: {type: integer, minimum: 1}
              equipments: {type: array, items: {type: object, required: [equipment_id, quantity], properties: {equipment_id: {type: integer}, quantity: {type: integer, minimum: 1}}}}
  schemas:
    SuccessEnvelope:
      type: object
      required: [status, code, message, data]
      properties:
        status: {type: string, enum: [success]}
        code: {type: integer}
        message: {type: string}
        data: {}
    ErrorEnvelope:
      type: object
      required: [status, code, message, errors]
      properties:
        status: {type: string, enum: [error]}
        code: {type: integer}
        message: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
  responses:
    Success:
      description: Successful request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SuccessEnvelope'}
    Error:
      description: API error; errors is always an array
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
