openapi: 3.0.3
info:
  title: Studio Rental API
  version: 1.0.0
  description: >-
    REST API for studio and equipment rental. Timestamps use Asia/Ho_Chi_Minh
    and the format YYYY-MM-DD HH:mm:ss. Money values are integer VND.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
  - name: Authentication
  - name: Catalog
  - name: Host
  - name: Booking
  - name: Administration
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200': {$ref: '#/components/responses/Success'}
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
                full_name: {type: string}
                phone: {type: string}
                role: {type: string, deprecated: true, description: Ignored; new accounts are customers}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and receive a two-hour bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/auth/logout:
    post:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Log out (client discards its token)
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
  /api/auth/profile:
    get:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Get current profile
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Update profile or password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: {type: string}
                phone: {type: string}
                current_password: {type: string}
                new_password: {type: string, minLength: 8}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/rooms:
    get:
      tags: [Catalog]
      summary: Search active rooms
      parameters:
        - {in: query, name: keyword, schema: {type: string}}
        - {in: query, name: space_type_id, schema: {type: integer}}
        - {in: query, name: rate_unit, schema: {type: string, enum: [hour, half_day, day, week, month, session]}}
        - {in: query, name: min_price, schema: {type: integer, minimum: 0}}
        - {in: query, name: max_price, schema: {type: integer, minimum: 0}}
        - {in: query, name: min_area, schema: {type: number, minimum: 0}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50, default: 12}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
    post:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Create a room in an owned studio
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/rooms/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Catalog]
      summary: Get room details
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Update owned room
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/rooms/{id}/calendar:
    get:
      tags: [Catalog]
      summary: Get busy intervals without customer details
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
  /api/rooms/{id}/rates:
    get:
      tags: [Catalog]
      summary: List effective room rates
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Success'}
    post:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Create a room rate
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/rooms/{id}/rates/{rate_id}:
    patch:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Update a rate belonging to the room
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {in: path, name: rate_id, required: true, schema: {type: integer}}
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/rooms/{id}/images:
    post:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Upload JPG, PNG, or WebP room image (5 MB maximum)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary}
                is_primary: {type: boolean}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/equipments:
    get:
      tags: [Catalog]
      summary: List active equipment for a studio
      parameters:
        - {in: query, name: studio_id, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
    post:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Create equipment in an owned studio
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
  /api/equipments/{id}:
    patch:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Update owned equipment
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/space-types:
    get:
      tags: [Catalog]
      summary: List space types
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/amenities:
    get:
      tags: [Catalog]
      summary: List amenities
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/studios/mine:
    get:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: List studios owned by current host
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/studios:
    post:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Create studio
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'201': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}
  /api/studios/{id}:
    patch:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Update owned studio
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}
  /api/equipment-categories:
    get:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: List equipment categories for an owned studio
      parameters: [{in: query, name: studio_id, required: true, schema: {type: integer}}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Create equipment category
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'201': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}
  /api/bookings/check-availability:
    post:
      tags: [Booking]
      summary: Check availability and quote price without writing or locking rows
      requestBody: {$ref: '#/components/requestBodies/BookingRequest'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/bookings:
    get:
      tags: [Booking]
      security: [{bearerAuth: []}]
      summary: List bookings visible to current customer or host
      parameters:
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, default: 1}}
        - {in: query, name: limit, schema: {type: integer, default: 12, maximum: 50}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Booking]
      security: [{bearerAuth: []}]
      summary: Create booking as customer
      requestBody: {$ref: '#/components/requestBodies/BookingRequest'}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/bookings/{id}:
    get:
      tags: [Booking]
      security: [{bearerAuth: []}]
      summary: Get booking detail visible to current customer or host
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /api/bookings/{id}/status:
    patch:
      tags: [Booking]
      security: [{bearerAuth: []}]
      summary: Host changes booking lifecycle state
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [status], properties: {status: {type: string, enum: [confirmed, checked_in, completed, rejected]}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/bookings/{id}/cancel:
    post:
      tags: [Booking]
      security: [{bearerAuth: []}]
      summary: Cancel own pending or confirmed booking
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/bookings/{id}/payments:
    post:
      tags: [Booking]
      security: [{bearerAuth: []}]
      summary: Create sandbox deposit, full, or remaining payment
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [payment_type], properties: {payment_type: {type: string, enum: [deposit, full, remaining]}, payment_method: {type: string, default: sandbox_qr}}}
      responses: {'201': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/admin/users:
    get:
      tags: [Administration]
      security: [{bearerAuth: []}]
      summary: List and filter users (admin)
      parameters:
        - {in: query, name: role, schema: {type: string}}
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: search, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, default: 1}}
        - {in: query, name: limit, schema: {type: integer, maximum: 50, default: 12}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/admin/users/{id}/status:
    patch:
      tags: [Administration]
      security: [{bearerAuth: []}]
      summary: Lock or unlock user (admin)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/admin/users/{id}/role:
    patch:
      tags: [Administration]
      security: [{bearerAuth: []}]
      summary: Set user role to host or customer (admin)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/admin/statistics:
    get:
      tags: [Administration]
      security: [{bearerAuth: []}]
      summary: Platform statistics for half-open period [from, to)
      parameters:
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/host/statistics:
    get:
      tags: [Host]
      security: [{bearerAuth: []}]
      summary: Statistics for current host studios and half-open period [from, to)
      parameters:
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    BookingRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [room_id, rate_id, start_time, end_time]
            properties:
              room_id: {type: integer}
              rate_id: {type: integer}
              start_time: {type: string, example: '2026-11-20 09:00:00'}
              end_time: {type: string, example: '2026-11-20 12:00:00'}
              party_size: {type: integer, minimum: 1}
              equipments: {type: array, items: {type: object, required: [equipment_id, quantity], properties: {equipment_id: {type: integer}, quantity: {type: integer, minimum: 1}}}}
  schemas:
    SuccessEnvelope:
      type: object
      required: [status, code, message, data]
      properties:
        status: {type: string, enum: [success]}
        code: {type: integer}
        message: {type: string}
        data: {}
    ErrorEnvelope:
      type: object
      required: [status, code, message, errors]
      properties:
        status: {type: string, enum: [error]}
        code: {type: integer}
        message: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
  responses:
    Success:
      description: Successful request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SuccessEnvelope'}
    Error:
      description: API error; errors is always an array
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
