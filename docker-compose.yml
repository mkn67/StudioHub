name: ${COMPOSE_PROJECT_NAME:-studiohub}

x-api: &api
  image: studio-rental-api:local
  build:
    context: ./server
    dockerfile: docker/api.Dockerfile
  working_dir: /var/www/html
  environment:
    APP_ENV: dev
    TZ: Asia/Ho_Chi_Minh
    DB_HOST: db
    DB_PORT: "3306"
    DB_NAME: ${DB_NAME:-studio_dev}
    DB_USER: ${DB_USER:-studio_user}
    DB_PASSWORD: ${DB_PASSWORD:-studio_password}
    DB_PASS: ${DB_PASSWORD:-studio_password}
    JWT_SECRET: ${JWT_SECRET:?Run node scripts/setup-docker.mjs first}
    ALLOWED_ORIGINS: http://localhost:${CLIENT_PORT:-3000},http://127.0.0.1:${CLIENT_PORT:-3000}
  volumes:
    - ./server:/var/www/html:ro
    - api_vendor:/var/www/html/vendor
    - api_uploads:/var/www/html/public/uploads

x-helpdesk: &helpdesk
  image: studiohub-helpdesk:local
  build:
    context: .
    dockerfile: helpdesk-php/Dockerfile
  env_file:
    - path: ./helpdesk-php/.env
      required: false
  environment:
    TZ: Asia/Ho_Chi_Minh
    HELPDESK_BRIDGE_SECRET: ${HELPDESK_BRIDGE_SECRET:?Run node scripts/setup-docker.mjs first}
    HELPDESK_FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${CLIENT_PORT:-3000}}
    HELPDESK_DATABASE_URL: sqlite:var/helpdesk.sqlite
    STUDIOHUB_API_BASE_URL: http://api/api
    NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-http://host.docker.internal:20128/v1}
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - helpdesk_data:/app/helpdesk-php/var

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${DB_NAME:-studio_dev}
      MYSQL_USER: ${DB_USER:-studio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-studio_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # Install Linux dependencies into a named volume; host source stays read-only.
  api-deps:
    <<: *api
    restart: "no"
    command:
      - sh
      - -ec
      - |
        composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
        chown -R www-data:www-data public/uploads

  # Bootstrap only an empty database; never reset or reseed existing tables.
  db-init:
    <<: *api
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      api-deps:
        condition: service_completed_successfully
    command: [php, bin/init-db.php]

  api:
    <<: *api
    restart: unless-stopped
    command: [apache2-foreground, -c, "ServerName localhost"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:80"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, php, -r, 'exit(@file_get_contents("http://127.0.0.1/api/health") === false ? 1 : 0);']
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s

  cron:
    <<: *api
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        trap 'exit 0' TERM INT
        while :; do
          php bin/expire-bookings.php || echo 'Booking expiry failed; retrying next cycle.' >&2
          sleep 60 & wait $$!
        done

  helpdesk-init:
    <<: *helpdesk
    restart: "no"
    user: www-data
    command: [php, bin/migrate.php, --apply]
    healthcheck:
      disable: true

  helpdesk-php:
    <<: *helpdesk
    restart: unless-stopped
    command: [apache2-foreground, -c, "ServerName localhost"]
    ports:
      - "127.0.0.1:${HELPDESK_PORT:-8010}:80"
    depends_on:
      helpdesk-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  client:
    image: studiohub-client:local
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
        NEXT_PUBLIC_DEMO_MODE: "false"
        NEXT_PUBLIC_HELPDESK_MODE: connected
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIENT_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://api
      HELPDESK_API_URL: http://helpdesk-php
      HELPDESK_HTTP_HOSTS: helpdesk-php
      HELPDESK_BRIDGE_SECRET: ${HELPDESK_BRIDGE_SECRET:?Run node scripts/setup-docker.mjs first}
      HELPDESK_FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${CLIENT_PORT:-3000}}
    depends_on:
      api:
        condition: service_healthy
      helpdesk-php:
        condition: service_healthy

volumes:
  # Preserve the original studiohub_mysqldata volume.
  mysqldata:
  api_vendor:
  api_uploads:
  helpdesk_data:
