version: '3.8'

services:
  db:
    image: docker.io/library/mysql:8.0
    container_name: studio_db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+07:00
      --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: studio_dev
      MYSQL_USER: studio_user
      MYSQL_PASSWORD: studio_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql:z
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u studio_user -pstudio_password || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    image: studio-rental-api:latest
    build:
      context: ./server
      dockerfile: docker/api.Dockerfile
    container_name: studio_api
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: dev
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET before starting the API}
      PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:-disabled}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: studio_dev
      DB_USER: studio_user
      DB_PASSWORD: studio_password
      DB_PASS: studio_password
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - ./server:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: studio-rental-api:latest
    build:
      context: ./server
      dockerfile: docker/api.Dockerfile
    container_name: studio_cron
    restart: unless-stopped
    environment:
      APP_ENV: dev
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET before starting the worker}
      PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:-disabled}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: studio_dev
      DB_USER: studio_user
      DB_PASSWORD: studio_password
      DB_PASS: studio_password
    volumes:
      - ./server:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "while true; do php /var/www/html/bin/expire-bookings.php || true; sleep 60; done"

  client:
    image: docker.io/library/node:24-alpine
    container_name: studio_client
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./client:/app:z
      # Native packages and Next caches must belong to Linux, not the Windows host.
      - client_node_modules:/app/node_modules
      - client_next:/app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_MODE=connected
      - BUSINESS_API_URL=http://api
      - APP_ORIGIN=http://localhost:3000
    command: sh -c "npm ci --include=dev --include=optional && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - api

volumes:
  mysqldata:
  client_node_modules:
  client_next:
