name: ${COMPOSE_PROJECT_NAME:-studiohub}

x-api: &api
  image: studio-rental-api:local
  build:
    context: ./server
    dockerfile: docker/api.Dockerfile
  working_dir: /var/www/html
  environment:
    APP_ENV: dev
    TZ: Asia/Ho_Chi_Minh
    DB_HOST: db
    DB_PORT: "3306"
    DB_NAME: ${LOCAL_DB_NAME:-studio_dev}
    DB_USER: ${LOCAL_DB_USER:-studio_user}
    DB_PASSWORD: ${LOCAL_DB_PASSWORD:-studio_password}
    DB_PASS: ${LOCAL_DB_PASSWORD:-studio_password}
    # Local Compose uses its private MySQL service without TLS. The mounted
    # server/.env is also used by Render and may contain an Aiven CA path.
    DB_SSL_CA: ""
    JWT_SECRET: ${LOCAL_JWT_SECRET:?Run node scripts/setup-docker.mjs first}
    ALLOWED_ORIGINS: http://localhost:${LOCAL_CLIENT_PORT:-3000},http://127.0.0.1:${LOCAL_CLIENT_PORT:-3000}
  volumes:
    - api_vendor:/var/www/html/vendor
    - api_uploads:/var/www/html/public/uploads
    - api_private:/var/www/html/storage

x-helpdesk: &helpdesk
  image: studiohub-helpdesk:local
  build:
    context: .
    dockerfile: helpdesk-php/Dockerfile
  env_file:
    - path: ./helpdesk-php/.env
      required: false
  environment:
    TZ: Asia/Ho_Chi_Minh
    PORT: "80"
    HELPDESK_BRIDGE_SECRET: ${LOCAL_HELPDESK_BRIDGE_SECRET:?Run node scripts/setup-docker.mjs first}
    HELPDESK_FRONTEND_ORIGIN: ${LOCAL_FRONTEND_ORIGIN:-http://localhost:${LOCAL_CLIENT_PORT:-3000}}
    HELPDESK_DATABASE_URL: sqlite:var/helpdesk.sqlite
    STUDIOHUB_API_BASE_URL: http://api/api
    NINEROUTER_BASE_URL: ${LOCAL_NINEROUTER_BASE_URL:-http://host.docker.internal:20128/v1}
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - helpdesk_data:/app/helpdesk-php/var

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${LOCAL_DB_NAME:-studio_dev}
      MYSQL_USER: ${LOCAL_DB_USER:-studio_user}
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-studio_password}
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-root_password}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  api:
    <<: *api
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
        mkdir -p public/uploads storage
        chown -R www-data:www-data public/uploads storage
        php bin/init.php --apply --seed
        php bin/migrate.php --apply
        php bin/migrate-sql.php --apply
        php bin/seed-booking-examples.php
        php bin/sync-demo-catalog.php --apply --once --skip-if-empty
        exec apache2-foreground -c "ServerName localhost"
    ports:
      - "127.0.0.1:${LOCAL_API_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, 'exit(@file_get_contents("http://127.0.0.1/api/health") === false ? 1 : 0);']
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s

  cron:
    <<: *api
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        trap 'exit 0' TERM INT
        while :; do
          php bin/expire-bookings.php || echo 'Booking expiry failed; retrying next cycle.' >&2
          sleep 60 & wait $$!
        done

  helpdesk-php:
    <<: *helpdesk
    restart: unless-stopped
    command: [sh, -ec, php bin/migrate.php --apply && exec apache2-foreground -c "ServerName localhost"]
    ports:
      - "127.0.0.1:${HELPDESK_PORT:-8010}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, 'exit((json_decode((string) @file_get_contents("http://127.0.0.1/health"), true)["status"] ?? "") === "success" ? 0 : 1);']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  client:
    image: studiohub-client:local
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${LOCAL_NEXT_PUBLIC_API_URL:-http://localhost:${LOCAL_API_PORT:-8000}}
        NEXT_PUBLIC_DEMO_MODE: "false"
        NEXT_PUBLIC_APP_MODE: rest
        NEXT_PUBLIC_HELPDESK_MODE: connected
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_CLIENT_PORT:-3000}:3000"
    environment:
      APP_ENV: dev
      API_INTERNAL_URL: http://api
      APP_ORIGIN: http://localhost:${LOCAL_CLIENT_PORT:-3000},http://127.0.0.1:${LOCAL_CLIENT_PORT:-3000}
      HELPDESK_API_URL: http://helpdesk-php
      HELPDESK_HTTP_HOSTS: helpdesk-php
      HELPDESK_BRIDGE_SECRET: ${LOCAL_HELPDESK_BRIDGE_SECRET:?Run node scripts/setup-docker.mjs first}
      HELPDESK_FRONTEND_ORIGIN: ${LOCAL_FRONTEND_ORIGIN:-http://localhost:${LOCAL_CLIENT_PORT:-3000}}
    # The browser-facing app can start independently; API requests occur after
    # page load. Avoid Podman Compose restarting completed init jobs transitively.

volumes:
  # Preserve the original studiohub_mysqldata volume.
  mysqldata:
  api_vendor:
  api_uploads:
  api_private:
  helpdesk_data:
